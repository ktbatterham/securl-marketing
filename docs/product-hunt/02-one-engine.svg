<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="760" viewBox="0 0 1270 760">
  <rect width="1270" height="760" fill="#060b16"/>
  <rect x="0" y="0" width="10" height="760" fill="#7aa6b6"/>
  <text x="72" y="86" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">SecURL</text>
  <text x="72" y="172" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">One passive engine.</text>
  <text x="72" y="236" fill="#7aa6b6" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">Every surface.</text>
  <text x="72" y="291" fill="#a8b2c6" font-family="Arial, Helvetica, sans-serif" font-size="22">The same outside-in evidence model wherever you work.</text>
  <rect x="72" y="364" width="250" height="202" rx="8" fill="#0c1424" stroke="#283956"/>
  <text x="102" y="414" fill="#d89a63" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">WEB APP</text>
  <text x="102" y="464" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Fast verdicts</text>
  <text x="102" y="503" fill="#8996ad" font-family="Arial, Helvetica, sans-serif" font-size="18">Full reports, evidence,</text>
  <text x="102" y="530" fill="#8996ad" font-family="Arial, Helvetica, sans-serif" font-size="18">exports, and monitoring.</text>
  <rect x="354" y="364" width="250" height="202" rx="8" fill="#0c1424" stroke="#283956"/>
  <text x="384" y="414" fill="#4ade80" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">MOBILE</text>
  <text x="384" y="464" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Watch changes</text>
  <text x="384" y="503" fill="#8996ad" font-family="Arial, Helvetica, sans-serif" font-size="18">SecURL, Header Watch,</text>
  <text x="384" y="530" fill="#8996ad" font-family="Arial, Helvetica, sans-serif" font-size="18">and Cert Watch.</text>
  <rect x="636" y="364" width="250" height="202" rx="8" fill="#0c1424" stroke="#283956"/>
  <text x="666" y="414" fill="#fcd34d" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">NPM + CLI</text>
  <text x="666" y="464" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Build locally</text>
  <text x="666" y="503" fill="#8996ad" font-family="Arial, Helvetica, sans-serif" font-size="18">Typed APIs, manifests,</text>
  <text x="666" y="530" fill="#8996ad" font-family="Arial, Helvetica, sans-serif" font-size="18">policy gates, and exports.</text>
  <rect x="918" y="364" width="280" height="202" rx="8" fill="#0c1424" stroke="#283956"/>
  <text x="948" y="414" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">CI + HOSTED API</text>
  <text x="948" y="464" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Enforce posture</text>
  <text x="948" y="503" fill="#8996ad" font-family="Arial, Helvetica, sans-serif" font-size="18">Repeatable contracts, drift,</text>
  <text x="948" y="530" fill="#8996ad" font-family="Arial, Helvetica, sans-serif" font-size="18">alerts, and integrations.</text>
  <text x="72" y="642" fill="#d1d8e5" font-family="Arial, Helvetica, sans-serif" font-size="23">Observation first. Deterministic. Passive by design.</text>
  <text x="72" y="700" fill="#8693aa" font-family="Arial, Helvetica, sans-serif" font-size="18">securl.online  •  npmjs.com/package/securl</text>
</svg>

